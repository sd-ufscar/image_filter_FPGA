name: Publicar resultados VGA (execucao unica)
on:
  push:
    paths:
      - '.github/assets/resultados_vga.zip'
      - '.github/workflows/publicar-resultados-vga.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extrair imagens originais do monitor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          source=Path('.github/assets/resultados_vga.zip')
          expected={'Original.jpeg','Erosao.jpeg','Dilatacao.jpeg','Gradiente.jpeg'}
          with zipfile.ZipFile(source) as z:
              entries=z.infolist()
              names={str(Path(e.filename).name) for e in entries}
              if len(entries)!=4 or names!=expected:raise RuntimeError('Arquivos inesperados no ZIP')
              for entry in entries:
                  p=Path(entry.filename)
                  if entry.is_dir() or len(p.parts)!=2 or p.parts[0]!='resultados_vga' or p.suffix!='.jpeg':
                      raise RuntimeError('Caminho invalido: '+str(p))
                  if entry.file_size>5_000_000:raise RuntimeError('Imagem excessivamente grande')
                  data=z.read(entry)
                  p.parent.mkdir(exist_ok=True)
                  p.write_bytes(data)
                  print('Foto preservada:',p,len(data),hashlib.sha256(data).hexdigest())
          PY
      - name: Registrar somente as quatro imagens
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resultados_vga/*.jpeg
          git diff --cached --quiet || (git commit -m 'docs: adiciona quatro registros VGA dos filtros' && git push origin HEAD:main)
