name: Publicar fotos do diagrama (unica execucao)
on:
  push:
    paths:
      - '.github/assets/diagramas_contraste.zip'
      - '.github/workflows/extrair_fotos.yml'
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extrair capturas monocromaticas preservando arquivos originais
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          archive=Path('.github/assets/diagramas_contraste.zip')
          with zipfile.ZipFile(archive) as z:
              names=z.namelist()
              if len(names)!=12: raise ValueError('Unexpected image count')
              for entry in z.infolist():
                  path=Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts or path.parts[0]!='fotos_do_diagrama' or path.suffix!='.png':
                      raise ValueError('Unexpected file: '+str(path))
                  if entry.file_size>2_000_000: raise ValueError('Image unexpectedly large')
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(z.read(entry))
          print('12 diagram screenshots published in fotos_do_diagrama/')
          PY
      - name: Commit images to same repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fotos_do_diagrama
          git diff --cached --quiet || (git commit -m 'docs: add 12 schematic screenshots to gallery' && git push origin HEAD:main)
