name: Extrair projeto original (uso unico)
on:
  push:
    paths:
      - .github/workflows/extrair-arquivo.yml
permissions:
  contents: write
jobs:
  extrair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validar e extrair ZIP preservando originais
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile, hashlib, stat
          archive=Path("Projeto_DE1_Somente_Esquematico.zip")
          dest=Path("projeto")
          lines=["# Inventário do arquivo original", "",
                 "Arquivo-fonte: `Projeto_DE1_Somente_Esquematico.zip`, preservado na raiz.", "",
                 "| Caminho no ZIP | Bytes | SHA-256 |", "|---|---:|---|"]
          count=0;total=0
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  name=info.filename.replace("\\","/")
                  p=PurePosixPath(name)
                  if info.is_dir(): continue
                  if p.is_absolute() or ".." in p.parts or any(":" in part for part in p.parts):
                      raise ValueError("Unsafe ZIP path: "+name)
                  if name.startswith("__MACOSX/") or p.name==".DS_Store": continue
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise ValueError("Symlink not allowed: "+name)
                  if info.file_size>40_000_000 or total+info.file_size>150_000_000 or count>3000:
                      raise ValueError("Archive content limits exceeded")
                  raw=z.read(info)
                  target=dest.joinpath(*p.parts)
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(raw)
                  count+=1;total+=len(raw)
                  digest=hashlib.sha256(raw).hexdigest()
                  lines.append(f"| `{name.replace(chr(124),'-')}` | {len(raw)} | `{digest}` |")
          if not count: raise ValueError("Empty ZIP")
          lines+=["",f"**{count} arquivos extraídos; {total} bytes no total.**",""]
          Path("INVENTARIO_EXTRACAO.md").write_text("\n".join(lines),encoding="utf-8")
          print(f"{count} extracted; {total} bytes")
          PY
      - name: Publicar apenas neste repositório
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projeto INVENTARIO_EXTRACAO.md
          if ! git diff --cached --quiet; then
             git commit -m 'chore: extract original schematic FPGA project'
             git push origin HEAD:main
          fi
